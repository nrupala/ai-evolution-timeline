<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Evolution Timeline</title>
  <script src="https://cdn.plot.ly/plotly-2.28.0.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      height: 100vh;
      margin: 0;
      background-color: #121212;
      color: #e0e0e0;
    }

    #timeline {
      flex: 3;
      background-color: #1e1e1e;
      margin: 10px;
      border-radius: 8px;
    }

    #sidebar {
      flex: 1;
      padding: 25px;
      background-color: #1e1e1e;
      border-left: 1px solid #333;
      overflow-y: auto;
    }

    h2,
    h3 {
      color: #ffffff;
    }

    .citation {
      font-size: 0.85em;
      color: #aaaaaa;
    }
  </style>
</head>

<body>
  <div id="timeline"></div>
  <div id="sidebar">
    <h2>Details</h2>
    <div id="details">Click an event to view details.</div>
  </div>

  <script src="data.js"></script>
  <script>
    const data = window.TIMELINE_DATA;
    const categories = ["architecture", "model", "agent", "product"];
    const traces = categories.map(cat => ({
      x: data.filter(d => d.category === cat).map(d => d.year),
      y: data.filter(d => d.category === cat).map(d => cat),
      mode: 'markers',
      name: cat,
      customdata: data.filter(d => d.category === cat).map(d => d.id)
    }))

    const layout = {
      title: { text: 'AI Evolution Timeline', font: { color: '#ffffff' } },
      paper_bgcolor: '#1e1e1e', // Dark background for the chart area
      plot_bgcolor: '#1e1e1e',
      font: { color: '#e0e0e0' },
      xaxis: {
        title: { text: 'Year', font: { color: '#ffffff' } },
        gridcolor: '#444'
      },
      yaxis: {
        title: { text: 'Category', font: { color: '#ffffff' } },
        gridcolor: '#444'
      }
    };

    Plotly.newPlot('timeline', traces, layout);

    Plotly.newPlot('timeline', traces, { title: 'AI Evolution Timeline' });

    document.getElementById('timeline').on('plotly_click', data => {
      const id = data.points[0].customdata;
      const item = window.TIMELINE_DATA.find(x => x.id === id);
      document.getElementById('details').innerHTML = `<h3>${item.event}</h3><p>${item.description}</p>`;
    });
  </script>
</body>

</html>
